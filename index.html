:root{--cream:#f5eedb;--cream-2:#ece2c6;--green:#1f3a22;--green-2:#4e6b45;--sage:#9fb08a;--gold:#b8955a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{min-height:100svh;background:radial-gradient(120% 90% at 50% 40%,var(--cream) 0%,var(--cream-2) 100%);color:var(--green);font-family:Poppins,system-ui,sans-serif;font-weight:300;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px;overflow-x:hidden;position:relative;-webkit-font-smoothing:antialiased}
main{position:relative;z-index:1;text-align:center;max-width:560px;display:flex;flex-direction:column;align-items:center}
.logo{width:min(220px,52vw);height:auto;color:var(--green);opacity:0;animation:rise 1.2s .1s ease-out forwards}
.rule{display:flex;align-items:center;gap:14px;margin:40px 0 28px;color:var(--gold);opacity:0;animation:rise 1s .5s ease-out forwards}
.rule span{width:56px;height:1px;background:currentColor}
.rule svg{width:18px;height:18px;fill:currentColor}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;font-size:clamp(34px,7vw,52px);line-height:1.1;letter-spacing:.01em;opacity:0;animation:rise 1s .7s ease-out forwards}
h1 em{font-style:italic;color:var(--green-2)}
p{margin-top:18px;font-size:clamp(14px,2.4vw,16px);line-height:1.7;color:var(--green-2);opacity:0;animation:rise 1s .9s ease-out forwards}
.tag{margin-top:36px;font-size:11px;letter-spacing:.38em;text-transform:uppercase;color:var(--gold);opacity:0;animation:rise 1s 1.1s ease-out forwards}
footer{position:relative;z-index:1;margin-top:56px;font-size:11px;letter-spacing:.12em;color:var(--green-2);opacity:.7}
.sprig{position:absolute;z-index:0;fill:var(--sage);opacity:.35;pointer-events:none}
.sprig .stem{fill:none;stroke:var(--sage);stroke-width:2}
.s1{width:min(340px,60vw);top:-40px;left:-60px;transform:rotate(18deg)}
.s2{width:min(380px,66vw);bottom:-60px;right:-70px;transform:rotate(200deg)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (max-width:520px){.d{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
</style>
